services:
    postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "psql -U ${DB_USER} -d ${DB_NAME} -c 'SELECT 1' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - postgres_data:/var/lib/postgresql/data
    manufacture-api:
        build:
            context: .
            dockerfile: Dockerfile
        image: manufacture-api:improved
        ports:
            - "${PORT}:${PORT}"
        depends_on:
            postgres:
                condition: service_healthy
    manufacture-api-naif:
        profiles:
            - comparaison
        build:
            context: .
            dockerfile: naif/Dockerfile.naif
        image: manufacture-api:naif
        ports:
            - "${PORT}"

volumes:
    postgres_data:
