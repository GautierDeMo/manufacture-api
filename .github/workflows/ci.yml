name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", ".env.example"]
  # Useful when the job needs to be launch manually
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement ciblé par le relancement"
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

jobs:

  test:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      -
        run: npm ci && npm run test
      -
        name: Upload a build artifact
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: rapport-node-${{ matrix.node }}
          path: coverage/

  build:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Manage tags and labels
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      -
        name: Set up QEMU for multi-arch building
        uses: docker/setup-qemu-action@v4
      -
        name: Set up docker container driver for the docker builder
        uses: docker/setup-buildx-action@v4.2.0
      -
        name: Build and push images
        uses: docker/build-push-action@v7.3.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      -
        id: v
        run: echo "version=1.$(date +%s)" >> "$GITHUB_OUTPUT"
    outputs:
      # Ce qui pourra servir lors du déploiement
      version: ${{ steps.v.outputs.version }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
