name: CI/CD/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", ".env.example"]
  # Useful when the job needs to be launch manually
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement ciblé par le relaunch"
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

jobs:
  tests_node_v:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Set up Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      -
        run: npm ci && npm run test
      -
        name: Upload the coverage report for Node v.${{ matrix.node }} artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rapport-node-${{ matrix.node }}
          path: coverage/

  scan_image:
    permissions:
      contents: read
      security-events: write

    needs: tests_node_v
    strategy:
      fail-fast: false
      matrix:
        include:
        -
          platform: linux/amd64
          arch: amd64
        -
          platform: linux/arm64
          arch: arm64
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Set up QEMU for multi-arch building
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        if: matrix.platform == 'linux/arm64'
      -
        name: Set up docker container driver for the docker builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      -
        name: Build ${{ matrix.platform }} image locally for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          load: true
          push: false
          tags: scan-target:${{ github.sha }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      -
        name: Scan with Trivy (table, artifact)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:${{ github.sha }}
          format: table
          output: trivy-results-${{ matrix.arch }}.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      -
        name: Scan with Trivy (sarif Code Scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:${{ github.sha }}
          output: trivy-results-${{ matrix.arch }}.sarif
          format: sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      -
        name: Upload the scan_image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles(format('trivy-results-{0}.txt', matrix.arch)) != ''
        with:
          name: trivy-results-${{ matrix.arch }}
          path: trivy-results-${{ matrix.arch }}.txt
      -
        name: Upload the scan results to Code Scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always() && hashFiles(format('trivy-results-{0}.sarif', matrix.arch)) != ''
        with:
          sarif_file: trivy-results-${{ matrix.arch }}.sarif
          category: trivy-results-${{ matrix.arch }}

  build_cd:
    needs: scan_image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      -
        name: Selected env.
        if: github.event_name == 'workflow_dispatch'
        run: echo "Environment = ${{ inputs.environment }}"
      -
        name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Manage tags and labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ startsWith(github.ref, 'refs/tags/v') && (inputs.environment || 'production') || 'staging' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      -
        name: Set up QEMU for multi-arch building
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      -
        name: Set up docker container driver for the docker builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      -
        name: Build and push images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64
          cache-to: type=gha,mode=max,scope=build
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      -
        id: v
        run: echo "version=1.$(date +%s)" >> "$GITHUB_OUTPUT"
    outputs:
      # What can be used for the deployment, and not the delivery
      version: ${{ steps.v.outputs.version }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
